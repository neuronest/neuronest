repository_variables:
  # general repository
  - REPOSITORY_NAME=database-api
  - REPOSITORY_CODE=da
  - PACKAGE_NAME=database_api
  - MAIN_TERRAFORM_MODULE_NAME=${PACKAGE_NAME}
multi_instance_resource_names:
  # docker image
  - BASE_IMAGE_NAME=database-api
  # service account name
  - SERVICE_ACCOUNT_NAME=database-api
  # cloud sql instance name
  - CLOUD_SQL_INSTANCE_NAME=neuronest
  - CLOUD_SQL_DB_NAME=neuronest
  - CLOUD_RUN_CLOUD_SQL_USERNAME=database-api
  - CLOUD_RUN_SERVICE_ACCOUNT_NAME=database-api
  - CLOUD_RUN_NAME=database-api

