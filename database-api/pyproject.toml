[build-system]
build-backend = "poetry.core.masonry.api"
requires = ["poetry-core>=1.0.0","pip>=20.0.0"]

[tool.isort]
known_first_party = ["database_api", "tests"]
profile = "black"

[tool.poetry]
authors = ["Côme Arvis <come.arvis@neuronest.net>", "Guillaume Ligner <guillaume.ligner@neuronest.net>"]
description = "Database api"
name = "database-api"
version = "0.1.0"

[tool.poetry.dependencies]
core = {path="../shared", develop = true}
fastapi = "^0.88.0"
gunicorn = "23.0.0"
psycopg2-binary = "^2.9.10"
pydantic = "1.10.6"
python = ">3.11,<3.12"  # Update the Python requirement here
sqlalchemy = "1.4.44"
uvicorn = "0.32.0"

[tool.poetry.group.dev]
optional = true

[tool.poetry.group.dev.dependencies]
core = { path="../shared", develop = true, extras = ["dev"] }
