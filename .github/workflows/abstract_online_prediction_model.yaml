name: abstract_online_prediction_model

on:
  workflow_call:
    inputs:
      build:
        required: false
        type: string
        default: 'true'
      deploy:
        required: false
        type: string
        default: 'true'
      post_deploy:
        required: false
        type: string
        default: 'true'
      run_tests:
        required: false
        type: string
        default: 'true'
      env_file_artifact_name:
        required: false
        type: string
        default: ''
      dockerhub_training_image_name:
        required: false
        type: string
        default: ''
      gcp_training_image_name:
        required: false
        type: string
        default: ''
      base_project_builder_sa_key:
        required: false
        type: string
        default: ''
      online_prediction_model_repository:
        required: true
        type: string
      online_prediction_model_package_name:
        required: true
        type: string
    outputs:
      web_serving_image_name:
        description: "The web serving image name"
        value: ${{ jobs.build_test_push_training_and_web_serving_images.outputs.gcp_web_serving_image_name }}
      gcp_training_image_name:
        description: "The gcp training image name"
        value: ${{ jobs.get_training_images.outputs.gcp_image }}
      dockerhub_training_image_name:
        description: "The dockerhub training image name"
        value: ${{ jobs.get_training_images.outputs.dockerhub_image }}
      model_instantiator_image_name:
        description: "Model instantiator image name"
        value: ${{ jobs.build_test_push_model_instantiator.outputs.gcp_image_name }}

env:
  REPOSITORY_NAME: ${{ inputs.online_prediction_model_repository }}
  TESTING_BASE_IMAGE: python:3.11.10-slim-bookworm
  GITHUB_BRANCH: ${{ github.head_ref || github.ref_name }}

jobs:
  run_base_terraform:
    runs-on: neuronest-runner-set
    if: ${{ (inputs.deploy == 'true' || inputs.deploy == '') && !failure() && !cancelled() }}
    container: google/cloud-sdk
    outputs:
      base_project_builder_sa_key: ${{ steps.run_base_terraform.outputs.base_project_builder_sa_key }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/set_variables_gcloud_auth
        with:
          credentials_json: ${{ secrets.NEURONEST_INFRASTRUCTURE_BUILDER_SERVICE_ACCOUNT }}
          env_file_artifact_name: ${{ inputs.env_file_artifact_name }}
      - id: run_base_terraform
        uses: ./.github/actions/run_base_terraform

  build_test_push_training_and_web_serving_images:
    name: build_test_push_training_and_web_serving_images
    runs-on: neuronest-runner-set
    needs: run_base_terraform
    # the documentation specifies that if only one job is skipped
    # in a series of jobs dependencies defined by the "needs: ", all subsequent jobs are
    # skipped. To allow jobs to run despite a skip in the series,
    # we use the !failure() condition
    # see: https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions#jobsjob_idneeds
    if: ${{ (inputs.build == 'true' || inputs.build == '') && !failure() && !cancelled() }}
    outputs:
      dockerhub_training_image_name: ${{ steps.build_test_push_training_image.outputs.dockerhub_image_name }}
      gcp_training_image_name: ${{ steps.build_test_push_training_image.outputs.gcp_image_name }}
      dockerhub_web_serving_image_name: ${{ steps.build_test_push_web_serving_image.outputs.dockerhub_image_name }}
      gcp_web_serving_image_name: ${{ steps.build_test_push_web_serving_image.outputs.gcp_image_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/set_variables
        with:
          env_file_artifact_name: ${{ inputs.env_file_artifact_name }}
          as_root: true
      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}
      - uses: ./.github/actions/gcloud_auth
        with:
          credentials_json: ${{ secrets.NEURONEST_INFRASTRUCTURE_BUILDER_SERVICE_ACCOUNT }}
      - id: build_test_push_training_image
        uses: ./.github/actions/build_test_push
        with:
          dockerhub_username: ${{ vars.DOCKERHUB_USERNAME }}
          dockerhub_password: ${{ secrets.DOCKERHUB_PASSWORD }}
          repository_name: ${{ env.REPOSITORY_NAME }}
          base_image_name: ${{ env.BASE_IMAGE_NAME }}
          target: training
          # todo: consider whether the default behavior should be to pass the arguments
          # REPOSITORY_NAME and PACKAGE_NAME during all docker builds. It would make
          # things less verbose, with almost only advantages: either the dockerfile
          # uses them, or docker ignores them
          build_arguments: --build-arg REPOSITORY_NAME=${{ env.REPOSITORY_NAME }} --build-arg PACKAGE_NAME=${{ env.PACKAGE_NAME }} --build-arg MODEL_NAME=${{ env.MODEL_NAME }}
          dockerfile_path: ${{ env.MODEL_DOCKERFILE_PATH }}
      - id: build_test_push_web_serving_image
        uses: ./.github/actions/build_test_push
        with:
          dockerhub_username: ${{ vars.DOCKERHUB_USERNAME }}
          dockerhub_password: ${{ secrets.DOCKERHUB_PASSWORD }}
          repository_name: ${{ env.REPOSITORY_NAME }}
          base_image_name: ${{ env.BASE_IMAGE_NAME }}
          build_arguments: --build-arg REPOSITORY_NAME=${{ env.REPOSITORY_NAME }} --build-arg PACKAGE_NAME=${{ env.PACKAGE_NAME }}
          dockerfile_path: ${{ env.WEB_SERVING_DOCKERFILE_PATH }}

  build_test_push_model_instantiator:
    name: build_test_push_model_instantiator
    runs-on: neuronest-runner-set
    needs: run_base_terraform
    # If the workflow isn't called, inputs are blank and job should run
    if: ${{ (inputs.build == 'true' || inputs.build == '') && !failure() && !cancelled() }}
    outputs:
      gcp_image_name: ${{ steps.build_test_push.outputs.gcp_image_name }}
      dockerhub_image_name: ${{ steps.build_test_push.outputs.dockerhub_image_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/set_variables
        with:
          env_file_artifact_name: ${{ inputs.env_file_artifact_name }}
          as_root: true
      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}
      - uses: ./.github/actions/gcloud_auth
        with:
          credentials_json: ${{ secrets.NEURONEST_INFRASTRUCTURE_BUILDER_SERVICE_ACCOUNT }}
      - id: build_test_push
        uses: ./.github/actions/build_test_push
        with:
          dockerhub_username: ${{ vars.DOCKERHUB_USERNAME }}
          dockerhub_password: ${{ secrets.DOCKERHUB_PASSWORD }}
          repository_name: model-instantiator
          base_image_name: ${{ env.MODEL_INSTANTIATOR_BASE_IMAGE_NAME }}
          dockerfile_path: ${{ env.WEB_SERVING_DOCKERFILE_PATH }}
          build_arguments: --build-arg REPOSITORY_NAME=model-instantiator --build-arg PACKAGE_NAME=model_instantiator

  deploy_online_prediction_model:
    needs:
     - build_test_push_training_and_web_serving_images
     - build_test_push_model_instantiator
     - run_base_terraform
    outputs:
      model_instantiator_url: ${{ steps.get_model_instantiator_url.outputs.value }}
      online_prediction_model_url: ${{ steps.get_online_prediction_model_url.outputs.value }}
    runs-on: neuronest-runner-set
    if: ${{ (inputs.deploy == 'true' || inputs.deploy == '') && !failure() && !cancelled() }}
    container:
      image: google/cloud-sdk
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/set_variables_gcloud_auth
        with:
          credentials_json: ${{ needs.run_base_terraform.outputs.base_project_builder_sa_key }}
          env_file_artifact_name: ${{ inputs.env_file_artifact_name }}
      - id: run_online_prediction_model_terraform
        uses: ./.github/actions/run_terraform
        with:
          targets: ${{ env.MAIN_TERRAFORM_RESOURCES }}
          workspace: ${{ env.REPOSITORY_NAME }}
        # favor environment variables that show up clearly in github logs over
        # var-like arguments to make it easier to reproduce errors locally
        env:
          TF_VAR_model_instantiator_image_name: ${{ needs.build_test_push_model_instantiator.outputs.gcp_image_name }}
          TF_VAR_image_name: ${{ needs.build_test_push_training_and_web_serving_images.outputs.gcp_web_serving_image_name }}
      - id: get_model_instantiator_url
        uses: ./.github/actions/get_terraform_output
        with:
          workspace: ${{ env.REPOSITORY_NAME }}
          terraform_output_name: model_instantiator_url
      - id: get_online_prediction_model_url
        uses: ./.github/actions/get_terraform_output
        with:
          workspace: ${{ env.REPOSITORY_NAME }}
          terraform_output_name: online_prediction_model_url

  get_training_images:
    runs-on: neuronest-runner-set
    needs: build_test_push_training_and_web_serving_images
    if: ${{ !failure() && !cancelled() }}
    outputs:
      dockerhub_image: ${{ steps.get_dockerhub_and_gcp_training_images.outputs.dockerhub_image }}
      gcp_image: ${{ steps.get_dockerhub_and_gcp_training_images.outputs.gcp_image }}
    steps:
      - id: get_dockerhub_and_gcp_training_images
        run: |
          job_dockerhub_training_image_name=${{ needs.build_test_push_training_and_web_serving_images.outputs.dockerhub_training_image_name }}
          input_dockerhub_training_image_name=${{ inputs.dockerhub_training_image_name }}
          dockerhub_training_image_name=${job_dockerhub_training_image_name:-$input_dockerhub_training_image_name}
          echo "dockerhub_image=$dockerhub_training_image_name" | tee -a $GITHUB_OUTPUT

          job_gcp_training_image_name=${{ needs.build_test_push_training_and_web_serving_images.outputs.gcp_training_image_name }}
          input_gcp_training_image_name=${{ inputs.gcp_training_image_name }}
          gcp_training_image_name=${job_gcp_training_image_name:-$input_gcp_training_image_name}
          echo "gcp_image=$gcp_training_image_name" | tee -a $GITHUB_OUTPUT

  get_base_project_builder_sa_key:
    runs-on: neuronest-runner-set
    needs: run_base_terraform
    if: ${{ !failure() && !cancelled() }}
    outputs:
      value: ${{ steps.get_base_project_builder_sa_key.outputs.base_project_builder_sa_key }}
    steps:
      - id: get_base_project_builder_sa_key
        run: |
          job_base_project_builder_sa_key=${{ needs.run_base_terraform.outputs.base_project_builder_sa_key }}
          input_base_project_builder_sa_key=${{ inputs.base_project_builder_sa_key }}
          # take the one that is not empty
          base_project_builder_sa_key=${job_base_project_builder_sa_key:-$input_base_project_builder_sa_key}
          echo "base_project_builder_sa_key=$base_project_builder_sa_key" | tee -a $GITHUB_OUTPUT

  train:
    name: train
    needs:
      - get_base_project_builder_sa_key
      - get_training_images
      - deploy_online_prediction_model
    runs-on: neuronest-runner-set
    # If the workflow isn't called, inputs are blank and job should run
    if: ${{ (inputs.post_deploy == 'true' || inputs.post_deploy == '') && !failure() && !cancelled() }}
    defaults:
      run:
        working-directory: ${{ env.REPOSITORY_NAME }}
    container:
      image: ${{needs.get_training_images.outputs.dockerhub_image}}
      credentials:
        username: ${{ vars.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_PASSWORD }}
    env:
      # todo: sans doute changer le model/model.pt hardcodé, on n'a pas de raison de
      # penser que cette valeur sera toujours la bonne. Le directory model est obtenu
      # via une variable d'environnement dans un environnement vertex et qui pourra
      # changer. La partie "model" du filename est une valeur par défaut du script
      # python, tout comme l'extension ".pt" qui est une valeur par défaut
      # Il suffit que vertex ou le code python ou les arguments du code python changent
      # pour que "model/model.pt" ne fonctionne plus, il vaudrait mieux trouver $
      # dynamiquement le path du model post training
      # exemple :
      #   model_gspath=$(gsutil ls -r "gs://${MODELS_BUCKET}/${PACKAGE_NAME}-${{ github.sha }}/**/*.pt")
      MODEL_WEIGHTS: model/model.pt
    outputs:
      model_gspath: ${{ steps.output_step.outputs.model_gspath }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/set_variables_gcloud_auth
        with:
          credentials_json: ${{ needs.get_base_project_builder_sa_key.outputs.value }}
          env_file_artifact_name: ${{ inputs.env_file_artifact_name }}
      - id: set_additional_variables
        run: |
          echo "MODEL_GSPATH"="gs://${MODELS_BUCKET}/${PACKAGE_NAME}-${{ github.sha }}" | tee -a $GITHUB_ENV
      - id: train
        run: |
          python -m ${PACKAGE_NAME}.cli --model-gspath $MODEL_GSPATH --actions train
        env:
          TRAINING_IMAGE_NAME: ${{ needs.get_training_images.outputs.gcp_image }}
          SERVICE_ACCOUNT_EMAIL: ${{ env.PROJECT_BUILDER_SERVICE_ACCOUNT_EMAIL }}
      # todo: il y a sûrement un premier problème de naming à corriger ici :
      # model_gspath qui devient {model_gspath}/{$model_weights} ça ne parait pas
      # logique.
      - id: output_step
        run: echo "model_gspath=$MODEL_GSPATH/$MODEL_WEIGHTS" | tee -a $GITHUB_OUTPUT

  build_test_push_model_serving_image:
    name: build_test_push_model_serving_image
    needs:
      - get_base_project_builder_sa_key
      - train
    runs-on: neuronest-runner-set
    # If the workflow isn't called, inputs are blank and job should run
    if: ${{ (inputs.post_deploy == 'true' || inputs.post_deploy == '') && !failure() && !cancelled() }}
    outputs:
      dockerhub_image_name: ${{ steps.build_test_push.outputs.dockerhub_image_name }}
      gcp_image_name: ${{ steps.build_test_push.outputs.gcp_image_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/set_variables
        with:
          env_file_artifact_name: ${{ inputs.env_file_artifact_name }}
          as_root: true
      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}
      - uses: ./.github/actions/gcloud_auth
        with:
          credentials_json: ${{ needs.get_base_project_builder_sa_key.outputs.value }}
      - id: set_additional_variables
        run: |
          echo "MODEL_PATH"="${{ env.REPOSITORY_NAME }}/model.pt" >> $GITHUB_ENV
      - id: download_model_weights
        run: gsutil cp ${{ needs.train.outputs.model_gspath }} $MODEL_PATH
      - id: build_test_push
        uses: ./.github/actions/build_test_push
        with:
          dockerhub_username: ${{ vars.DOCKERHUB_USERNAME }}
          dockerhub_password: ${{ secrets.DOCKERHUB_PASSWORD }}
          repository_name: ${{ env.REPOSITORY_NAME }}
          base_image_name: ${{ env.BASE_IMAGE_NAME }}
          target: serving
          build_arguments: --build-arg MODEL_PATH=$MODEL_PATH --build-arg REPOSITORY_NAME=${{ env.REPOSITORY_NAME }} --build-arg PACKAGE_NAME=${{ env.PACKAGE_NAME }} --build-arg MODEL_NAME=${{ env.MODEL_NAME }} --build-arg BATCH_SIZE=${{ env.BATCH_SIZE }}
          dockerfile_path: ${{ env.MODEL_DOCKERFILE_PATH }}

  model_upload:
    name: model_upload
    needs:
      - get_base_project_builder_sa_key
      - get_training_images
      - build_test_push_model_serving_image
    runs-on: neuronest-runner-set
    # If the workflow isn't called, inputs are blank and job should run
    if: ${{ (inputs.post_deploy == 'true' || inputs.post_deploy == '') && !failure() && !cancelled() }}
    defaults:
      run:
        working-directory: ${{ env.REPOSITORY_NAME }}
    container:
      image: ${{needs.get_training_images.outputs.dockerhub_image}}
      credentials:
        username: ${{ vars.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/set_variables_gcloud_auth
        with:
          credentials_json: ${{ needs.get_base_project_builder_sa_key.outputs.value }}
          env_file_artifact_name: ${{ inputs.env_file_artifact_name }}
      - id: model_upload
        run: python -m ${PACKAGE_NAME}.cli --actions model_upload
        env:
          SERVING_IMAGE_NAME: ${{ needs.build_test_push_model_serving_image.outputs.gcp_image_name }}

  run_integration_tests:
    runs-on: neuronest-runner-set
    needs:
      - run_base_terraform
      - model_upload
      - deploy_online_prediction_model
    # If the workflow isn't called, inputs are blank and job should run
    if: ${{ (inputs.run_tests == 'true' || inputs.run_tests == '') && !failure() && !cancelled() }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/set_variables
        with:
          env_file_artifact_name: ${{ inputs.env_file_artifact_name }}
          as_root: true
      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}
      - uses: ./.github/actions/gcloud_auth
        with:
          credentials_json: ${{ needs.run_base_terraform.outputs.base_project_builder_sa_key }}
      - id: get_model_name
        run: |
          echo value=$(env | grep -E '*MODEL_NAME=' | cut -d '=' -f2-) >> $GITHUB_OUTPUT
        shell: bash
      - id: get_package_url_variable_name
        run: |
          package_name_uppercase=$(echo "${{ inputs.online_prediction_model_package_name }}" | tr '[:lower:]' '[:upper:]')
          echo value="${package_name_uppercase}_URL" >> $GITHUB_OUTPUT
        shell: bash
      - id: test_integration
        uses: ./.github/actions/run_linters_tests
        with:
          image_name: ${{ env.TESTING_BASE_IMAGE }}
          repository_name: ${{ env.REPOSITORY_NAME }}
          run_integration_tests: true
          run_unit_tests: false
          environment_variables: -e ${{ steps.get_package_url_variable_name.outputs.value }}=${{ needs.deploy_online_prediction_model.outputs.online_prediction_model_url }} -e MODEL_NAME=${{ steps.get_model_name.outputs.value }} -e MODEL_INSTANTIATOR_HOST=${{ needs.deploy_online_prediction_model.outputs.model_instantiator_url }} -e PROJECT_ID=${{ env.PROJECT_ID }}
