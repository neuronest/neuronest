#      - .github/variables/**
#      - .pre-commit-config.yaml
#      - shared/**
#      - model-instantiator/**
#      - video-comparator/**
#      - object-detection/**

env:
  GITHUB_BRANCH: ${{ github.head_ref || github.ref_name }}

jobs:

  functional_database_api:
    uses: ./.github/workflows/functional_database_api.yaml
    with:
      build: true
      deploy: true
      do_post_deployment: true
    secrets: inherit

  functional_people_counting:
    uses: ./.github/workflows/functional_people_counting.yaml
    secrets: inherit

