name: neuronest

on:
  workflow_dispatch:
  push:
    paths:
      - shared/**
      - .github/workflows/neuronest.yaml
      - .github/workflows/functional_abstract_online_prediction_model.yaml
      - .github/workflows/abstract_online_prediction_model.yaml
      - .github/workflows/functional_people_counting.yaml
      - .github/workflows/functional_video_comparator.yaml
      - .github/workflows/functional_object_detection.yaml
      - .github/workflows/functional_database_api.yaml
      - .pre-commit-config.yaml
      - people-counting/**
      - object-detection/**
      - model-instantiator/**
      - video-comparator/**
      - database-api/**
      - functional-database-api/**
      - .github/workflows/database_api.yaml
      - .github/actions/**
      - .github/variables/**
      - .pre-commit-config.yaml
