#      - .github/variables/**
#      - .pre-commit-config.yaml
#      - shared/**
#      - people-counting/**
#      - object-detection/**
#      - model-instantiator/**
  workflow_dispatch:
  workflow_call:
    inputs:
      build:
        required: false
        type: string
        default: 'true'
      deploy:
        required: false
        type: string
        default: 'true'
      post_deploy:
        required: false
        type: string
        default: 'true'
      run_tests:
        required: false
        type: string
        default: 'true'
      env_file_artifact_name:
        required: false
        type: string
        default: ''
env:
  REPOSITORY_NAME: functional-people-counting
  GITHUB_BRANCH: ${{ github.head_ref || github.ref_name }}
  TESTING_BASE_IMAGE: python:3.11.10-slim-bookworm

jobs:
  upload_variables_of_called_workflows:
    runs-on: neuronest-runner-set
    container: google/cloud-sdk
    outputs:
      env_file_artifact_name: ${{ steps.upload_variables.outputs.env_file_artifact_name }}
    steps:
      - uses: actions/checkout@v4
      - name: upload_variables
        id: upload_variables
        uses: ./.github/actions/upload_variables
        with:
          env_file_artifact_name: ${{ inputs.env_file_artifact_name }}

  run_base_terraform:
    runs-on: neuronest-runner-set
    # If the workflow isn't called, inputs are blank and job should run
    if: ${{ (inputs.deploy == 'true' || inputs.deploy == '') && !failure() && !cancelled() }}
    container: google/cloud-sdk
    outputs:
      base_project_builder_sa_key: ${{ steps.run_base_terraform.outputs.base_project_builder_sa_key }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/set_variables_gcloud_auth
        with:
          credentials_json: ${{ secrets.NEURONEST_INFRASTRUCTURE_BUILDER_SERVICE_ACCOUNT }}
          env_file_artifact_name: ${{ inputs.env_file_artifact_name }}
      - id: run_base_terraform
        uses: ./.github/actions/run_base_terraform

  build_functional_object_detection:
    needs:
      - upload_variables_of_called_workflows
    uses: ./.github/workflows/functional_abstract_online_prediction_model.yaml
    with:
      build: true
      deploy: false
      post_deploy: false
      run_tests: false
      env_file_artifact_name: ${{ needs.upload_variables_of_called_workflows.outputs.env_file_artifact_name }}
      online_prediction_model_repository: functional-object-detection
      online_prediction_model_package_name: object_detection
    secrets: inherit

  build_test_push:
    needs: upload_variables_of_called_workflows
    uses: ./.github/workflows/people_counting.yaml
    with:
      build: true
      deploy: false
      env_file_artifact_name: ${{ needs.upload_variables_of_called_workflows.outputs.env_file_artifact_name }}
    secrets: inherit

  deploy:
    name: deploy
    runs-on: neuronest-runner-set
    needs:
      - run_base_terraform
      - build_functional_object_detection
      - build_test_push
    # If the workflow isn't called, inputs are blank and job should run
    if: ${{ (inputs.deploy == 'true' || inputs.deploy == '') && !failure() && !cancelled() }}
    outputs:
      model_instantiator_url: ${{ steps.get_model_instantiator_url.outputs.value }}
      people_counting_url: ${{ steps.get_people_counting_url.outputs.value }}
    container:
      image: google/cloud-sdk
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/set_variables_gcloud_auth
        with:
          credentials_json: ${{ needs.run_base_terraform.outputs.base_project_builder_sa_key }}
          env_file_artifact_name: ${{ inputs.env_file_artifact_name }}
      - uses: ./.github/actions/run_terraform
        with:
          targets: ${{ env.MAIN_TERRAFORM_RESOURCES }}
          workspace: ${{ env.REPOSITORY_NAME }}
        # favor environment variables that show up clearly in github logs over
        # var-like arguments to make it easier to reproduce errors locally
        env:
          TF_VAR_model_instantiator_image_name: ${{ needs.build_functional_object_detection.outputs.model_instantiator_image_name }}
          TF_VAR_object_detection_image_name: ${{ needs.build_functional_object_detection.outputs.web_serving_image_name }}
          TF_VAR_people_counting_image_name: ${{ needs.build_test_push.outputs.gcp_image_name }}
      - id: get_model_instantiator_url
        uses: ./.github/actions/get_terraform_output
        with:
          workspace: ${{ env.REPOSITORY_NAME }}
          terraform_output_name: model_instantiator_url
      - id: get_people_counting_url
        uses: ./.github/actions/get_terraform_output
        with:
          workspace: ${{ env.REPOSITORY_NAME }}
          terraform_output_name: people_counting_url

  post_deploy_functional_object_detection:
    needs:
     - upload_variables_of_called_workflows
     - build_functional_object_detection
     - deploy
    uses: ./.github/workflows/functional_abstract_online_prediction_model.yaml
    with:
      build: false
      deploy: false
      post_deploy: true
      run_tests: false
      env_file_artifact_name: ${{ needs.upload_variables_of_called_workflows.outputs.env_file_artifact_name }}
      dockerhub_training_image_name: ${{ needs.build_functional_object_detection.outputs.dockerhub_training_image_name }}
      gcp_training_image_name: ${{ needs.build_functional_object_detection.outputs.gcp_training_image_name }}
      online_prediction_model_repository: functional-object-detection
      online_prediction_model_package_name: object_detection
    secrets: inherit

  run_integration_tests:
    runs-on: neuronest-runner-set
    needs:
      - run_base_terraform
      - deploy
      - post_deploy_functional_object_detection
    # If the workflow isn't called, inputs are blank and job should run
    if: ${{ (inputs.run_tests == 'true' || inputs.run_tests == '') && !failure() && !cancelled() }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/set_variables
        with:
          env_file_artifact_name: ${{ inputs.env_file_artifact_name }}
          as_root: true
      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}
      - uses: ./.github/actions/gcloud_auth
        with:
          credentials_json: ${{ needs.run_base_terraform.outputs.base_project_builder_sa_key }}
      - uses: ./.github/actions/run_linters_tests
        with:
          image_name: ${{ env.TESTING_BASE_IMAGE }}
          run_integration_tests: true
          run_unit_tests: false
          environment_variables: -e MODEL_NAME=${{ env.OBJECT_DETECTION_MODEL_NAME }} -e PEOPLE_COUNTING_URL=${{ needs.deploy.outputs.people_counting_url }} -e PROJECT_ID=${{ env.PROJECT_ID }} -e MODEL_INSTANTIATOR_HOST=${{ needs.deploy.outputs.model_instantiator_url }}
