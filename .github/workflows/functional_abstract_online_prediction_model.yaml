name: abstract_functional_online_prediction_model

on:
  workflow_call:
    inputs:
      build:
        required: false
        type: string
        default: 'true'
      deploy:
        required: false
        type: string
        default: 'true'
      post_deploy:
        required: false
        type: string
        default: 'true'
      run_tests:
        required: false
        type: string
        default: 'true'
      env_file_artifact_name:
        required: false
        type: string
        default: ''
      dockerhub_training_image_name:
        required: false
        type: string
        default: ""
      gcp_training_image_name:
        required: false
        type: string
        default: ""
      online_prediction_model_repository:
        required: true
        type: string
      online_prediction_model_package_name:
        required: true
        type: string
    outputs:
      web_serving_image_name:
        description: "The web serving image name"
        value: ${{ jobs.build_test_push_online_prediction_model.outputs.gcp_web_serving_image_name }}
      gcp_training_image_name:
        description: "The gcp training image name"
        value: ${{ jobs.get_training_images.outputs.gcp_image }}
      dockerhub_training_image_name:
        description: "The dockerhub training image name"
        value: ${{ jobs.get_training_images.outputs.dockerhub_image }}
      model_instantiator_image_name:
        description: "Model instantiator image name"
        value: ${{ jobs.build_test_push_model_instantiator.outputs.gcp_image_name }}

env:
  REPOSITORY_NAME: ${{ inputs.online_prediction_model_repository }}
  TESTING_BASE_IMAGE: python:3.11.10-slim-bookworm
  GITHUB_BRANCH: ${{ github.head_ref || github.ref_name }}

jobs:
  set_up_non_functional_repository_name:
    runs-on: neuronest-runner-set
    container: google/cloud-sdk
    outputs:
      value: ${{ steps.set_up_non_functional_repository_name.outputs.value }}
    steps:
      - id: set_up_non_functional_repository_name
        run: |
          value=${REPOSITORY_NAME#functional-}
          echo value=$value >> $GITHUB_OUTPUT
        shell: bash

  run_base_terraform:
    runs-on: neuronest-runner-set
    if: ${{ (inputs.deploy == 'true' || inputs.deploy == '') && !failure() && !cancelled() }}
    container: google/cloud-sdk
    outputs:
      base_project_builder_sa_key: ${{ steps.run_base_terraform.outputs.base_project_builder_sa_key }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/set_variables_gcloud_auth
        with:
          credentials_json: ${{ secrets.NEURONEST_INFRASTRUCTURE_BUILDER_SERVICE_ACCOUNT }}
          env_file_artifact_name: ${{ inputs.env_file_artifact_name }}
      - id: run_base_terraform
        uses: ./.github/actions/run_base_terraform

  upload_variables_of_called_workflows:
    runs-on: neuronest-runner-set
    container: google/cloud-sdk
    outputs:
      online_prediction_model_env_file_artifact_name: ${{ steps.upload_online_prediction_model_variables.outputs.env_file_artifact_name }}
      model_instantiator_env_file_artifact_name: ${{ steps.upload_model_instantiator_variables.outputs.env_file_artifact_name }}
    steps:
      - uses: actions/checkout@v4
      - name: upload_online_prediction_model_variables
        id: upload_online_prediction_model_variables
        uses: ./.github/actions/upload_variables
        with:
          variable_prefix_to_filter_on: current_repository_variables_prefix
          env_file_artifact_name: ${{ inputs.env_file_artifact_name }}
      - name: upload_model_instantiator_variables
        id: upload_model_instantiator_variables
        uses: ./.github/actions/upload_variables
        with:
          variable_prefix_to_filter_on: MODEL_INSTANTIATOR
          env_file_artifact_name: ${{ inputs.env_file_artifact_name }}

  build_test_push_online_prediction_model:
    needs: [set_up_non_functional_repository_name, run_base_terraform, upload_variables_of_called_workflows]
    if: ${{ (inputs.build == 'true' || inputs.build == '') && !failure() && !cancelled() }}
    uses: ./.github/workflows/abstract_online_prediction_model.yaml
    with:
      build: true
      deploy: false
      post_deploy: false
      env_file_artifact_name: ${{ needs.upload_variables_of_called_workflows.outputs.online_prediction_model_env_file_artifact_name }}
      online_prediction_model_repository: ${{ needs.set_up_non_functional_repository_name.outputs.value }}
    secrets: inherit

  build_test_push_model_instantiator:
    needs: [run_base_terraform, upload_variables_of_called_workflows]
    if: ${{ (inputs.build == 'true' || inputs.build == '') && !failure() && !cancelled() }}
    uses: ./.github/workflows/model_instantiator.yaml
    with:
      build: true
      deploy: false
      post_deploy: false
      env_file_artifact_name: ${{ needs.upload_variables_of_called_workflows.outputs.model_instantiator_env_file_artifact_name }}
    secrets: inherit

  deploy_functional_online_prediction_model:
    needs:
     - build_test_push_online_prediction_model
     - build_test_push_model_instantiator
     - run_base_terraform
    outputs:
      model_instantiator_url: ${{ steps.get_model_instantiator_url.outputs.value }}
      online_prediction_model_url: ${{ steps.get_online_prediction_model_url.outputs.value }}
    runs-on: neuronest-runner-set
    if: ${{ (inputs.deploy == 'true' || inputs.deploy == '') && !failure() && !cancelled() }}
    container:
      image: google/cloud-sdk
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/set_variables_gcloud_auth
        with:
          credentials_json: ${{ needs.run_base_terraform.outputs.base_project_builder_sa_key }}
          env_file_artifact_name: ${{ inputs.env_file_artifact_name }}
      - id: set_online_prediction_model_image_variable
        run: |
          # Construct the dynamic environment variable name with "TF_VAR_" prefix
          DYNAMIC_VAR_NAME="TF_VAR_${{ inputs.online_prediction_model_package_name }}_image_name"
          DYNAMIC_VAR_VALUE="${{ needs.build_test_push_online_prediction_model.outputs.gcp_web_serving_image_name }}"
          echo "${DYNAMIC_VAR_NAME}=${DYNAMIC_VAR_VALUE}" >> $GITHUB_ENV
      - id: run_functional_online_prediction_model_terraform
        uses: ./.github/actions/run_terraform
        with:
          targets: ${{ env.MAIN_TERRAFORM_RESOURCES }}
          workspace: ${{ env.REPOSITORY_NAME }}
        # favor environment variables that show up clearly in github logs over
        # var-like arguments to make it easier to reproduce errors locally
        env:
          TF_VAR_model_instantiator_image_name: ${{ needs.build_test_push_model_instantiator.outputs.gcp_image_name }}
      - id: get_model_instantiator_url
        uses: ./.github/actions/get_terraform_output
        with:
          workspace: ${{ env.REPOSITORY_NAME }}
          terraform_output_name: model_instantiator_url
      - id: get_online_prediction_model_url
        uses: ./.github/actions/get_terraform_output
        with:
          workspace: ${{ env.REPOSITORY_NAME }}
          terraform_output_name: online_prediction_model_url

  get_training_images:
    runs-on: neuronest-runner-set
    needs: build_test_push_online_prediction_model
    if: ${{ !failure() && !cancelled() }}
    outputs:
      dockerhub_image: ${{ steps.get_dockerhub_and_gcp_training_images.outputs.dockerhub_image }}
      gcp_image: ${{ steps.get_dockerhub_and_gcp_training_images.outputs.gcp_image }}
    steps:
      - id: get_dockerhub_and_gcp_training_images
        run: |
          job_dockerhub_training_image_name=${{ needs.build_test_push_online_prediction_model.outputs.dockerhub_training_image_name }}
          input_dockerhub_training_image_name=${{ inputs.dockerhub_training_image_name }}
          dockerhub_training_image_name=${job_dockerhub_training_image_name:-$input_dockerhub_training_image_name}
          echo "dockerhub_image=$dockerhub_training_image_name" | tee -a $GITHUB_OUTPUT

          job_gcp_training_image_name=${{ needs.build_test_push_online_prediction_model.outputs.gcp_training_image_name }}
          input_gcp_training_image_name=${{ inputs.gcp_training_image_name }}
          gcp_training_image_name=${job_gcp_training_image_name:-$input_gcp_training_image_name}
          echo "gcp_image=$gcp_training_image_name" | tee -a $GITHUB_OUTPUT

  post_deploy_online_prediction_model:
    # the job in the needs section is necessary to recover its output
    needs:
      - run_base_terraform
      - deploy_functional_online_prediction_model
      - get_training_images
      - upload_variables_of_called_workflows
      - set_up_non_functional_repository_name
    if: ${{ (inputs.post_deploy == 'true' || inputs.post_deploy == '') && !failure() && !cancelled() }}
    uses: ./.github/workflows/abstract_online_prediction_model.yaml
    with:
      build: false
      deploy: false
      post_deploy: true
      gcp_training_image_name: ${{ needs.get_training_images.outputs.gcp_image }}
      dockerhub_training_image_name: ${{ needs.get_training_images.outputs.dockerhub_image }}
      base_project_builder_sa_key: ${{ needs.run_base_terraform.outputs.base_project_builder_sa_key }}
      env_file_artifact_name: ${{ needs.upload_variables_of_called_workflows.outputs.online_prediction_model_env_file_artifact_name }}
      online_prediction_model_repository: ${{ needs.set_up_non_functional_repository_name.outputs.value }}
    secrets: inherit

  post_deploy_model_instantiator:
    needs: [deploy_functional_online_prediction_model, upload_variables_of_called_workflows]
    if: ${{ (inputs.post_deploy == 'true' || inputs.post_deploy == '') && !failure() && !cancelled() }}
    uses: ./.github/workflows/model_instantiator.yaml
    with:
      build: false
      deploy: false
      post_deploy: true
      env_file_artifact_name: ${{ needs.upload_variables_of_called_workflows.outputs.model_instantiator_env_file_artifact_name }}
    secrets: inherit

  run_integration_tests:
    runs-on: neuronest-runner-set
    needs:
      - run_base_terraform
      - post_deploy_online_prediction_model
      - post_deploy_model_instantiator
      - deploy_functional_online_prediction_model
    # If the workflow isn't called, inputs are blank and job should run
    if: ${{ (inputs.run_tests == 'true' || inputs.run_tests == '') && !failure() && !cancelled() }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/set_variables
        with:
          env_file_artifact_name: ${{ inputs.env_file_artifact_name }}
          as_root: true
      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}
      - uses: ./.github/actions/gcloud_auth
        with:
          credentials_json: ${{ needs.run_base_terraform.outputs.base_project_builder_sa_key }}
      - id: get_model_name
        run: |
          echo value=$(env | grep -E '*MODEL_NAME=' | cut -d '=' -f2-) >> $GITHUB_OUTPUT
        shell: bash
      - id: get_package_url_variable_name
        run: |
          package_name_uppercase=$(echo "${{ inputs.online_prediction_model_package_name }}" | tr '[:lower:]' '[:upper:]')
          echo value="${package_name_uppercase}_URL" >> $GITHUB_OUTPUT
        shell: bash
      - id: test_integration
        uses: ./.github/actions/run_linters_tests
        with:
          image_name: ${{ env.TESTING_BASE_IMAGE }}
          run_integration_tests: true
          run_unit_tests: false
          environment_variables: -e ${{ steps.get_package_url_variable_name.outputs.value }}=${{ needs.deploy_functional_online_prediction_model.outputs.online_prediction_model_url }} -e MODEL_NAME=${{ steps.get_model_name.outputs.value }} -e MODEL_INSTANTIATOR_HOST=${{ needs.deploy_functional_online_prediction_model.outputs.model_instantiator_url }} -e PROJECT_ID=${{ env.PROJECT_ID }} -e REGION=${{ env.REGION }}
