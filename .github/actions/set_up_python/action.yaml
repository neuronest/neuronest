name: 'set_up_python'
inputs:
  python_version:
    description: 'Python version to install'
    required: false
    default: '3.11'
  python_environment_location:
    description: 'Python environment location'
  already_exists_do_the_set_up:
    description: 'Whether to force python installation even if already here'
    required: false
    default: 'false'
description: 'Install specified version of Python and create a virtual environment'
runs:
  using: "composite"
  steps:
    # Set up Python using the official GitHub Action
# Note: No root or sudo privileges are required for this setup
    - name: Set up Python using actions/setup-python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python_version }}

    # Create a virtual environment in the user-defined location
    - name: Create virtual environment in specified location
      run: |
        # Check if we need to set up the environment (forced by input or if directory doesn't exist)
        if [ "${{ inputs.already_exists_do_the_set_up }}" = "true" ] || [ ! -d "${{ inputs.python_environment_location }}" ]; then
          echo "Creating virtual environment at: ${{ inputs.python_environment_location }}"

          # Create the virtual environment
          python -m venv "${{ inputs.python_environment_location }}"

          # Add the virtual environment's bin directory to PATH for following steps
          echo "${{ inputs.python_environment_location }}/bin" >> $GITHUB_PATH

          # Activate the virtual environment and upgrade pip
          source "${{ inputs.python_environment_location }}/bin/activate"
          python -m pip install --upgrade pip
        else
          echo "Virtual environment already exists, skipping setup"
        fi
      shell: bash
