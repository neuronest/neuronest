[build-system]
build-backend = "poetry.core.masonry.api"
requires = ["pip>=20.0.0", "poetry-core>=1.0.0"]

[project.scripts]
model-instantiator = "model_instantiator.cli:app"

[tool.isort]
known_first_party = ["model_instantiator"]
profile = "black"

[tool.poetry]
authors = ["Côme Arvis <come.arvis@neuronest.net>", "Guillaume Ligner <guillaume.ligner@neuronest.net>"]
description = "Model instantiator"
name = "model-instantiator"
version = "0.1.0"

[tool.poetry.dependencies]
core = {develop = true, path = "../shared"}
python = ">=3.10,<3.12"
python-json-logger = "2.0.7"

[tool.poetry.group.app]
optional = true

[tool.poetry.group.app.dependencies]
fastapi = "0.115.2"
gunicorn = "23.0.0"
typer = "0.15.3"
uvicorn = "0.32.0"

[tool.poetry.group.dev]
optional = true

[tool.poetry.group.dev.dependencies]
core = {develop = true, extras = ["dev"], path = "../shared"}
