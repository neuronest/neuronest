repository_variables:
  # general repository
  - REPOSITORY_NAME=object-detection
  - REPOSITORY_CODE=od
  - PACKAGE_NAME=object_detection
  - MAIN_TERRAFORM_MODULE_NAME=${PACKAGE_NAME}
  - REPOSITORIES_DEPENDENCIES=model-instantiator
multi_instance_resource_names:
  # docker image
  - BASE_IMAGE_NAME=object-detection
  # service account name
  - SERVICE_ACCOUNT_NAME=webapp
  # firestore
  - FIRESTORE_JOBS_COLLECTION=jobs
  # cloud run
  - CLOUD_RUN_NAME=webapp
  # vertex
  - MODEL_NAME=model
  # storage
  - MODELS_BUCKET=models-${PROJECT_CODE}
  - SAMPLES_BUCKET=samples-${PROJECT_CODE}
  - RESULTS_BUCKET=results-${PROJECT_CODE}
other_variables:
  branch:
    default:
    # shared
    - REGION=${VERTEX_LOCATION}
    # GCP project
    - PROJECT_ID=${NON_FUNCTIONAL_SERVICES_PROJECT_ID}
    - PROJECT_CODE=${NON_FUNCTIONAL_SERVICES_PROJECT_CODE}
    # cloud run
    - CLOUD_RUN_MEMORY=4Gi
    - CLOUD_RUN_CPU=1000m
    - CLOUD_RUN_MIN_SCALE=0
    - CLOUD_RUN_MAX_SCALE=1
    - CLOUD_RUN_TIMEOUT=2700s
    # vertex
    - VERTEX_LOCATION=europe-west1
    - SERVING_ACCELERATOR_TYPE=NVIDIA_TESLA_T4
    - SERVING_ACCELERATOR_COUNT=1
    - BATCH_SIZE=1  # dangerous for now to increase the batch size
    - MAX_BATCH_DELAY=50
    # artifact registry
    - GCP_REGISTRY_LOCATION=${VERTEX_LOCATION}
