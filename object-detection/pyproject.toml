[build-system]
build-backend = "poetry.core.masonry.api"
requires = ["pip>=20.0.0", "poetry-core>=1.0.0"]

[tool.isort]
known_first_party = ["object_detection", "tests"]
profile = "black"

[tool.poetry]
authors = ["Côme Arvis <come.arvis@neuronest.net>", "Guillaume Ligner <guillaume.ligner@neuronest.net>"]
description = "Object detection"
name = "object-detection"
version = "0.1.0"

[tool.poetry.dependencies]
core = {develop = true, path = "../shared"}
python = ">3.11,<3.12"

[tool.poetry.group.app]
optional = true

[tool.poetry.group.app.dependencies]
fastapi = "0.115.2"
gunicorn = "23.0.0"
uvicorn = "0.32.0"

[tool.poetry.group.dev]
optional = true

[tool.poetry.group.dev.dependencies]
core = {develop = true, extras = ["dev"], path = "../shared"}

[tool.poetry.group.model]
optional = true

[tool.poetry.group.model.dependencies]
PyYAML = "6.0.2" # implicit torchhub ultralytics dependency
core = {develop = true, extras = ["torch"], path = "../shared"}
imutils = "0.5.4"
ipython = "8.28.0" # implicit torchhub ultralytics dependency
python = ">3.11,<3.12"
scipy = "1.14.1" # implicit torchhub ultralytics dependency
seaborn = "0.13.2" # implicit torchhub ultralytics dependency
torchvision = "0.20.0"
ultralytics = "8.3.18"
