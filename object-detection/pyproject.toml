[build-system]
build-backend = "poetry.core.masonry.api"
requires = ["poetry-core>=1.0.0","pip>=20.0.0"]

[tool.isort]
known_first_party = ["object_detection", "tests"]
profile = "black"

[tool.poetry]
authors = ["Côme Arvis <come.arvis@neuronest.net>", "Guillaume Ligner <guillaume.ligner@neuronest.net>"]
description = "Object detection"
name = "object-detection"
version = "0.1.0"

[tool.poetry.dependencies]
PyYAML = "6.0.2"  # implicit torchhub ultralytics dependency
core = {path="../shared", develop = true}
imutils = "0.5.4"
ipython = "8.28.0"  # implicit torchhub ultralytics dependency
python = ">3.12,<3.13"
scipy = "1.14.1"  # implicit torchhub ultralytics dependency
seaborn = "0.13.2"  # implicit torchhub ultralytics dependency
torchvision = "0.20.0"
ultralytics = "8.3.18"

[tool.poetry.group.dev]
optional = true

[tool.poetry.group.dev.dependencies]
core = { path="../shared", develop = true, extras = ["dev", "torch"] }
