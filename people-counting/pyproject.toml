[build-system]
build-backend = "poetry.core.masonry.api"
requires = ["pip>=20.0.0", "poetry-core>=1.0.0"]

[tool.isort]
known_first_party = ["people_counting"]
profile = "black"

[tool.poetry]
authors = ["Côme Arvis <come.arvis@neuronest.net>", "Guillaume Ligner <guillaume.ligner@neuronest.net>"]
description = "People counting project"
name = "people-counting"
version = "0.1.0"

[tool.poetry.dependencies]
core = {develop = true, path = "../shared"}
python = ">3.11,<3.12"

[tool.poetry.group.app]
optional = true

[tool.poetry.group.app.dependencies]
dlib = "19.24.6"
fastapi = "0.115.2"
gunicorn = "23.0.0"
psutil = "6.1.0"
scipy = "1.14.1"
uvicorn = "0.32.0"

[tool.poetry.group.dev.dependencies]
core = {develop = true, extras = ["dev"], path = "../shared"}
ipython = "*"
ipython-genutils = "*"
matplotlib = "*"
seaborn = "*"
