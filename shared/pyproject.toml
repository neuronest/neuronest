[build-system]
build-backend = "poetry.core.masonry.api"
requires = ["poetry-core>=1.0.0", "setuptools"]

[tool.isort]
known_first_party = ["core"]
profile = "black"

[tool.poetry]
authors = ["Côme Arvis <come.arvis@neuronest.net>", "Guillaume Ligner <guillaume.ligner@neuronest.net>"]
description = "Core dependencies"
name = "core"
packages = [{include = "core"}]
version = "0.1.0"

[tool.poetry.dependencies]
backoff = "2.2.1"
black = {optional = true, version = "24.10.0"}
ffmpeg-python = "0.2.0"
flake8 = {optional = true, version = "7.1.1"}
google-api-python-client = "^2.162.0"
google-cloud-aiplatform = "1.70.0"
google-cloud-bigquery = "3.26.0"
google-cloud-firestore = "2.19.0"
google-cloud-logging = "3.11.3"
google-cloud-run = "0.10.9"
google-cloud-storage = "2.18.2"
imutils = "0.5.4"
isort = {optional = true, version = "5.13.2"}
joblib = "1.4.2"
librosa = "0.10.2.post1"
moviepy = "1.0.3"
numpy = "<2.1" # https://github.com/numba/numba/issues/9708
nvgpu = {optional = true, version = "0.10.0"}
omegaconf = "2.3.0"
opencv-contrib-python-headless = "4.10.0.84"
pandas = "2.2.3"
pre-commit = {optional = true, version = "4.0.1"}
pydantic = "2.9.2"
pylint = {optional = true, version = "3.3.1"}
pytest = {optional = true, version = "8.3.3"}
pytest-xdist = {optional = true, version = "3.6.1"}
python = ">3.11,<3.12"
tenacity = "^9.0.0"
toml-sort = {optional = true, version = "0.23.1"}
torch = {optional = true, version = "2.5.0"}
torch-model-archiver = {optional = true, version = "0.12.0"}
torch-workflow-archiver = {optional = true, version = "0.2.15"}
torchserve = {optional = true, version = "0.12.0"}
tqdm = "4.66.5"
typing-inspect = "0.9.0"

[tool.poetry.extras]
dev = ["black", "flake8", "isort", "pre-commit", "pylint", "pytest", "pytest-xdist", "toml-sort"]
torch = ["nvgpu", "torch", "torch-model-archiver", "torch-workflow-archiver", "torchserve"]
