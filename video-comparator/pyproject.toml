[build-system]
build-backend = "poetry.core.masonry.api"
requires = ["poetry-core>=1.0.0","pip>=20.0.0"]

[tool.isort]
known_first_party = ["video_comparator", "tests"]
profile = "black"

[tool.poetry]
authors = ["Côme Arvis <come.arvis@neuronest.net>", "Guillaume Ligner <guillaume.ligner@neuronest.net>"]
description = "Video comparator"
name = "video-comparator"
version = "0.1.0"

[tool.poetry.dependencies]
core = {path="../shared", develop = true}
nvgpu = "^0.9.0"  # torchserve dependency
python = ">3.11,<3.12"
scikit-learn = "^1.3.0"
torch = { version = "2.5.0" }
torch-model-archiver = { version = "0.12.0" }
torch-workflow-archiver = { version = "0.2.15" }
torchserve = { version = "0.12.0" }
torchvision = "0.20.0"

[tool.poetry.group.dev]
optional = true

[tool.poetry.group.dev.dependencies]
core = { path="../shared", develop = true, extras = ["dev"] }
