[build-system]
build-backend = "poetry.core.masonry.api"
requires = ["pip>=20.0.0", "poetry-core>=1.0.0"]

[tool.isort]
known_first_party = ["tests", "video_comparator"]
profile = "black"

[tool.poetry]
authors = ["Côme Arvis <come.arvis@neuronest.net>", "Guillaume Ligner <guillaume.ligner@neuronest.net>"]
description = "Video comparator"
name = "video-comparator"
version = "0.1.0"

[tool.poetry.dependencies]
core = {develop = true, path = "../shared"}
python = ">=3.10,<3.12"

[tool.poetry.group.app]
optional = true

[tool.poetry.group.app.dependencies]
fastapi = "0.115.2"
gunicorn = "23.0.0"
uvicorn = "0.32.0"

[tool.poetry.group.dev]
optional = true

[tool.poetry.group.dev.dependencies]
core = {develop = true, extras = ["dev", "torch"], path = "../shared"}

[tool.poetry.group.model]
optional = true

[tool.poetry.group.model.dependencies]
core = {develop = true, extras = ["torch"], path = "../shared"}
torchvision = "0.20.0"
