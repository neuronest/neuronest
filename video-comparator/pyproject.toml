[build-system]
build-backend = "poetry.core.masonry.api"
requires = ["poetry-core>=1.0.0","pip>=20.0.0"]

[tool.isort]
known_first_party = ["video_comparator", "tests"]
profile = "black"

[tool.poetry]
authors = ["Côme Arvis <come.arvis@neuronest.net>", "Guillaume Ligner <guillaume.ligner@neuronest.net>"]
description = "Video comparator"
name = "video-comparator"
version = "0.1.0"

[tool.poetry.dependencies]
core = {path="../shared", develop = true}
fastapi = "0.115.2"
gunicorn = "23.0.0"
python = ">3.12,<3.13"
scikit-learn = "1.5.2"
torchvision = "0.20.0"
uvicorn = "0.32.0"

[tool.poetry.group.dev]
optional = true

[tool.poetry.group.dev.dependencies]
core = { path="../shared", develop = true, extras = ["dev", "torch"] }
